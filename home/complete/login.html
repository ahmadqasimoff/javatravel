<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport"
          content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>Login</title>

    <!-- Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet"/>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"/>

    <!-- Custom CSS -->
    <style>
        * {
            font-family: Poppins, sans-serif;
        }

        body {
            background: #f5f7fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background: #fff;
            width: 380px;
            padding: 32px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
            transition: .3s;
        }

        .login-card:hover {
            transform: translateY(-5px);
        }

        .form-floating input:focus {
            border-color: #0071c2;
            box-shadow: 0 0 0 2px rgba(0,113,194,.2);
        }

        #submit-btn {
            background: #0071c2;
            border-radius: 8px;
            border: none;
            height: 50px;
            transition: .3s;
        }

        #submit-btn:hover {
            background: linear-gradient(45deg,#0071c2,#005d9f);
            transform: translateY(-2px);
        }

        #create-account {
            height: 50px;
            border-radius: 8px;
        }

        /* Chrome autofill fix */
        input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 1000px white inset !important;
        }

        @media(max-width:450px) {
            .login-card {
                width: 92%;
            }
        }
    </style>

</head>
<body>

    <div class="login-card">

        <div class="text-center mb-3">
            <h4 class="mb-0 fw-bold">Login Panel</h4>
        </div>
            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="email"
                       placeholder="Email" />
                <label>Email</label>
            </div>

            <div class="form-floating mb-3">
                <input type="password" class="form-control" id="password"
                       placeholder="Password" />
                <label>Password</label>
            </div>

            <div class="flex flex-row justify-between align-items-center mb-2">

                <div class="form-check">
                    <input class="form-check-input" type="checkbox" checked />
                    <label><small>Remember Me</small></label>
                </div>
                <a href="#" class="text-decoration-none"><small>Forgot Password?</small></a>
                </div>
                <div class="flex flex-row justify-between"></div>
            <button id="submit-btn"
                    class="btn text-white w-100 d-flex align-items-center justify-content-center">
                Login
            </button>

            <div id="spinner-container" class="d-none mt-2">
                <button class="btn btn-dark w-100" disabled>
                    <span class="spinner-border spinner-border-sm"></span> Loading...
                </button>
            </div>
            <a href="http://127.0.0.1:5500/home/sing%20up.html"
               id="create-account"
               class="btn btn-secondary w-100 mt-3 d-flex align-items-center justify-content-center">
               Create Account
            </a>
               </div>
        </form>


    </div>

    <!-- jQuery -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function submission(evt) {
            evt = evt || window.event;

            const email = $("#email").val().trim();
            if (!email) {
                evt.preventDefault();
                alert("Email is required to login");
                return false;
            }

            const pass = $("#password").val().trim();
            if (!pass) {
                evt.preventDefault();
                alert("Password is required to login");
                return false;
            }

            document.getElementById('submit-btn').classList.add('d-none');
            document.getElementById('spinner-container').classList.remove('d-none');

            return true;
        }
    </script>

</body>
</html>
